<aside class="sidebar">

  <!-- =====================================================
       BRAND
       ===================================================== -->

  <div class="brand">

    <div class="brand-mark">

      <svg
        viewBox="0 0 42 42"
        fill="none"
        aria-hidden="true">

        <path
          d="M21 3L38 34H30.5L26.8 27H15.2L11.5 34H4L21 3Z"
          fill="url(#sidebarBrandGradient)"
        />

        <path
          d="M18.7 21.5H25.3L22 15.2L18.7 21.5Z"
          fill="currentColor"
        />

        <defs>

          <linearGradient
            id="sidebarBrandGradient"
            x1="8"
            y1="7"
            x2="34"
            y2="35"
            gradientUnits="userSpaceOnUse">

            <stop
              offset="0%"
              stop-color="#61B8FF" />

            <stop
              offset="100%"
              stop-color="#2875FF" />

          </linearGradient>

        </defs>

      </svg>

    </div>


    <div class="brand-copy">

      <div class="brand-name">
        Astra<span>Flow</span>
      </div>

      <div class="brand-tagline">
        TRAFFIC INTELLIGENCE
      </div>

    </div>

  </div>


  <!-- =====================================================
       PRIMARY NAVIGATION
       ===================================================== -->

  <nav class="nav-section">

    <div class="nav-label">
      MONITOR
    </div>


    <!-- OVERVIEW -->

    <button
      class="nav-item"
      type="button"
      [class.active]="router.url === '/dashboard'"
      (click)="navigateTo('/dashboard')">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <path
          d="M4 13.5L12 4l8 9.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-6.5Z">
        </path>

      </svg>

      <span>Overview</span>

    </button>


    <!-- LIVE MONITOR -->

    <button
      class="nav-item"
      type="button"
      [class.active]="router.url === '/live-monitor'"
      (click)="navigateTo('/live-monitor')">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <rect
          x="3"
          y="5"
          width="18"
          height="14"
          rx="2">
        </rect>

        <path d="M8 10l4 2.5L8 15v-5Z"></path>

        <path d="M17 9v6"></path>

      </svg>

      <span>Live Monitor</span>

      <span class="live-dot"></span>

    </button>


    <!-- ANALYTICS -->

    <button
      class="nav-item"
      type="button"
      [class.active]="router.url === '/analytics'"
      (click)="navigateTo('/analytics')">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <path d="M4 19V9"></path>
        <path d="M10 19V5"></path>
        <path d="M16 19v-7"></path>
        <path d="M22 19V3"></path>
        <path d="M2 19h21"></path>

      </svg>

      <span>Analytics</span>

    </button>


    <!-- VIOLATIONS -->

    <button
      class="nav-item"
      type="button"
      [class.active]="router.url === '/violations'"
      (click)="navigateTo('/violations')">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <path d="M12 3l9 18H3L12 3Z"></path>

        <path d="M12 9v5"></path>

        <circle
          cx="12"
          cy="17"
          r=".7">
        </circle>

      </svg>

      <span>Violations</span>

      <span class="count">
        12
      </span>

    </button>


    <!-- CAMERAS -->

    <button
      class="nav-item"
      type="button"
      [class.active]="router.url === '/cameras'"
      (click)="navigateTo('/cameras')">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <rect
          x="3"
          y="5"
          width="15"
          height="14"
          rx="2">
        </rect>

        <path d="M18 9l3-2v10l-3-2"></path>

        <circle
          cx="8"
          cy="12"
          r="2">
        </circle>

      </svg>

      <span>Cameras</span>

    </button>


    <!-- REPORTS -->

    <button
      class="nav-item"
      type="button"
      [class.active]="router.url === '/reports'"
      (click)="navigateTo('/reports')">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <path d="M6 3h9l3 3v15H6V3Z"></path>

        <path d="M9 11h6"></path>
        <path d="M9 15h6"></path>
        <path d="M9 7h3"></path>

      </svg>

      <span>Reports</span>

    </button>

  </nav>


  <!-- =====================================================
       SYSTEM
       ===================================================== -->

  <nav class="nav-section second">

    <div class="nav-label">
      SYSTEM
    </div>


    <!-- SETTINGS -->

    <button
      class="nav-item"
      type="button"
      [class.active]="router.url === '/settings'"
      (click)="navigateTo('/settings')">

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true">

        <circle
          cx="12"
          cy="12"
          r="3">
        </circle>

        <path
          d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.1h-2.4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1A1.7 1.7 0 0 0 8.4 15a1.7 1.7 0 0 0-1.6-1H6.7v-2.4h.1a1.7 1.7 0 0 0 1.6-1A1.7 1.7 0 0 0 8.1 8.7L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.1h2.4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1Z">
        </path>

      </svg>

      <span>Settings</span>

    </button>

  </nav>


  <!-- =====================================================
       SIDEBAR BOTTOM
       ===================================================== -->

  <div class="sidebar-bottom">


    <!-- AI STATUS CARD -->

    <div class="ai-card">

      <div class="ai-top">

        <div class="ai-icon">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true">

            <path
              d="M9 4h6v3h2a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-2v3H9v-3H7a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3h2V4Z">
            </path>

            <path d="M9 12h6"></path>
            <path d="M12 9v6"></path>

          </svg>

        </div>


        <div class="ai-copy">

          <div class="ai-title">
            Astra AI
          </div>

          <div class="ai-subtitle">
            Intelligence engine
          </div>

        </div>


        <span class="ai-status"></span>

      </div>


      <p>
        Real-time detection, anomaly monitoring
        and predictive traffic insights.
      </p>

    </div>


    <!-- SYSTEM STATUS -->

    <div class="sidebar-footer">

      <span class="status-dot"></span>

      <span>
        All systems operational
      </span>

    </div>

  </div>

</aside>
