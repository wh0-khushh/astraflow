<header class="topbar">

  <!-- MOBILE BRAND -->
  <div class="mobile-brand">

    <div class="brand-mark brand-mark-small">
      <img
        src="assets/brand/astraflow-logo-wordmark.jpeg"
        class="brand-logo-crop"
        alt="AstraFlow logo"
      />
    </div>

    <div class="mobile-brand-copy">
      <strong>
        Astra<span>Flow</span>
      </strong>

      <small>TRAFFIC INTELLIGENCE</small>
    </div>

  </div>


  <!-- MOBILE MENU -->
  <button
    class="mobile-menu-button"
    type="button"
    aria-label="Open navigation"
    (click)="onMenuClick()">

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16"></path>
      <path d="M4 12h16"></path>
      <path d="M4 18h16"></path>
    </svg>

  </button>


  <!-- SEARCH -->
  <form
    class="search-box"
    role="search"
    (ngSubmit)="runSearch()">

    <svg
      class="search-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <circle
        cx="11"
        cy="11"
        r="6.5">
      </circle>

      <path d="m16 16 5 5"></path>

    </svg>

    <input
      type="search"
      placeholder="Search cameras, zones... (opens Cameras)"
      aria-label="Search cameras and zones"
      [(ngModel)]="searchTerm"
      name="searchTerm"
    />

  </form>


  <!-- ACTIONS -->
  <div class="topbar-actions">

    <!-- NOTIFICATIONS -->
<app-notifications></app-notifications>


    <div class="top-divider"></div>


    <!-- PROFILE -->
<div class="profile">

  <div class="avatar">
    K
  </div>

  <div class="profile-info">
    <strong>Khushi</strong>
    <span>Administrator</span>
  </div>

  <button
    class="logout-button"
    type="button"
    (click)="logout()"
    aria-label="Logout">

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"></path>
      <path d="M14 8l4 4-4 4"></path>
      <path d="M9 12h9"></path>
    </svg>

  </button>

</div>

  </div>

</header>
